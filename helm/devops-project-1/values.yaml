replicaCount: 2

image:
  repository: devops-project-1
  tag: latest
  pullPolicy: Never

service:
  type: NodePort
  port: 5000
  targetPort: 5000

containerPort: 5000

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: true

config:
  appEnv: "development"

secret:
  appSecret: "devops-project-secret"