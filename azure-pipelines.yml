trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:

  - stage: Validate
    displayName: "Validate"

    jobs:
      - job: Validate
        displayName: "Validate Project"

        steps:

          - checkout: self
            displayName: "Checkout Repository"

          - script: |
              echo "Validating project structure..."

              test -f Dockerfile
              test -f app/app.py
              test -f app/requirements.txt
              test -d helm/devops-project-1
              test -f terraform/main.tf

              echo "Project structure is valid."
            displayName: "Validate Project Structure"

  - stage: Tests
    displayName: "Application Tests"

    dependsOn: Validate

    jobs:
      - job: Pytest
        displayName: "Run Python Tests"

        steps:

          - checkout: self
            displayName: "Checkout Repository"

          - script: |
              python3 -m pip install --upgrade pip
              pip install -r app/requirements.txt
            displayName: "Install Dependencies"

          - script: |
              pytest -v
            displayName: "Run Pytest"

  - stage: Docker
    displayName: "Docker Build & Test"

    dependsOn: Tests

    jobs:
      - job: DockerBuild
        displayName: "Build and Test Docker Image"

        steps:

          - checkout: self
            displayName: "Checkout Repository"

          - script: |
              docker build \
                -t devops-project-1:$(Build.BuildId) \
                .
            displayName: "Build Docker Image"

          - script: |
              docker run -d \
                --name devops-project-1-test \
                -p 5000:5000 \
                devops-project-1:$(Build.BuildId)
            displayName: "Start Test Container"

          - script: |
              sleep 5
              curl --fail http://localhost:5000/health
            displayName: "Health Check"

          - script: |
              docker logs devops-project-1-test
              docker rm -f devops-project-1-test
            displayName: "Cleanup Test Container"

  - stage: Security
    displayName: "Security Scan"

    dependsOn: Docker

    jobs:
      - job: TrivyScan
        displayName: "Scan Docker Image"

        steps:

          - checkout: self
            displayName: "Checkout Repository"

          - script: |
              docker build \
                -t devops-project-1:$(Build.BuildId) \
                .
            displayName: "Build Docker Image for Scan"

          - script: |
              sudo apt-get update
              sudo apt-get install -y wget apt-transport-https gnupg lsb-release

              wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
                | gpg --dearmor \
                | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

              echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
                | sudo tee /etc/apt/sources.list.d/trivy.list

              sudo apt-get update
              sudo apt-get install -y trivy
            displayName: "Install Trivy"

          - script: |
              trivy image \
                --severity HIGH,CRITICAL \
                --exit-code 1 \
                devops-project-1:$(Build.BuildId)
            displayName: "Scan Docker Image"

  - stage: Helm
    displayName: "Helm Validation"

    dependsOn: Security

    jobs:
      - job: HelmValidation
        displayName: "Validate Helm Chart"

        steps:

          - checkout: self
            displayName: "Checkout Repository"

          - task: HelmInstaller@1
            displayName: "Install Helm"
            inputs:
              helmVersionToInstall: "latest"

          - script: |
              helm lint ./helm/devops-project-1
            displayName: "Helm Lint"

          - script: |
              helm template devops-project-1 ./helm/devops-project-1
            displayName: "Render Helm Templates"

          - script: |
              helm template devops-project-1 ./helm/devops-project-1 > rendered.yaml
              test -s rendered.yaml
              echo "Kubernetes manifests rendered successfully."
            displayName: "Validate Kubernetes Manifests"